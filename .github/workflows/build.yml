name: Build desktop apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: build:win
            artifact: windows
          - platform: macOS
            os: macos-latest
            command: build:mac
            artifact: macos
          - platform: Linux
            os: ubuntu-latest
            command: build:linux
            artifact: linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Package application
        run: npm run ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ai-agent-management-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
